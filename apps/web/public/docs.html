<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders API — Reference</title>
  </head>
  <body>
    <!-- The "API 直接展示": an executable OpenAPI reference (Try-it-out)
         rendered from openapi.json, which is itself projected from the Zod SSOT. -->
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference("#app", {
        url: "./openapi.json",
        theme: "default",
      });
    </script>
  </body>
</html>
