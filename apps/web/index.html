<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders API — Console</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 1.5rem; max-width: 980px; }
      h1 { font-size: 1.25rem; }
      .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .5rem 0; }
      button { padding: .4rem .7rem; cursor: pointer; border: 1px solid #8884; border-radius: 6px; background: #8881; }
      input { padding: .4rem; border: 1px solid #8884; border-radius: 6px; min-width: 18rem; }
      label { opacity: .8; }
      pre { background: #8881; padding: 1rem; border-radius: 8px; overflow: auto; min-height: 12rem; white-space: pre-wrap; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>Orders API — Console <small>(<a href="./docs.html">OpenAPI reference ↗</a>)</small></h1>
    <div class="row">
      <label for="apiBase">API base</label>
      <input id="apiBase" placeholder="https://xxxx.execute-api.us-east-1.amazonaws.com" />
    </div>
    <div class="row">
      <button id="btnList">List</button>
      <button id="btnCreate">Create sample</button>
      <input id="orderId" placeholder="order id (filled after create)" />
      <button id="btnGet">Get</button>
      <button id="btnUpdate">Mark PAID</button>
      <button id="btnDelete">Delete</button>
    </div>
    <pre id="out">// responses appear here</pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
